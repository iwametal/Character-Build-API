events {
    worker_connections 1024;
}

http {
    upstream character_api_cluster {
        # In Docker Compose, the service name 'api' resolves to all 5 container replicas
        server api:8000;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://character_api_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Ensure custom instance headers pass through
            proxy_pass_header X-Instance-ID;
            proxy_pass_header X-Instance-PID;

            # Connection timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}

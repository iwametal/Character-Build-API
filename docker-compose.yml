services:
  # ----------------------------------------------------------------------------
  # Character Build API Cluster (5 Replicas)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: character-build-api:v2
    deploy:
      replicas: 5
      restart_policy:
        condition: on-failure
    environment:
      - ENVIRONMENT=docker-compose
      - DATABASE_URL=sqlite:////app/data/character-build.db
      - JWT_SECRET=supersecretjwtkey_fatec_2026_rbac_token_protection
      - PORT=8000
    volumes:
      - character_data:/app/data
    networks:
      - character-net

  # ----------------------------------------------------------------------------
  # Gateway / Load Balancer (Round-robin across the 5 API instances)
  # ----------------------------------------------------------------------------
  gateway:
    image: nginx:alpine
    container_name: character_build_gateway
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - character-net

# ------------------------------------------------------------------------------
# Persistent Storage & Networks
# ------------------------------------------------------------------------------
volumes:
  character_data:
    driver: local

networks:
  character-net:
    driver: bridge

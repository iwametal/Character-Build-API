name: CI — Quality, Tests & Container Validation

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "bugfix/**"
      - "release/**"
      - "hotfix/**"
  pull_request:
    branches:
      - main
      - develop
      - "release/**"
      - "hotfix/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Análise Estática, Sintaxe Python e Validação dos Manifestos K8s
  # ----------------------------------------------------------------------------
  quality-and-lint:
    name: Quality & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "src/api/requirements.txt"

      - name: Install lint and validation utilities
        run: python -m pip install --upgrade pip ruff pyyaml

      - name: Verify Python syntax compilation
        run: python -m compileall -q src/

      - name: Run Ruff static analysis
        continue-on-error: true
        run: ruff check src/

      - name: Validate Kubernetes YAML manifests (k8s/)
        run: |
          python -c "
          import glob, yaml
          files = sorted(glob.glob('k8s/*.yaml') + glob.glob('k8s/*.yml'))
          assert files, 'No Kubernetes manifests found in k8s/'
          for path in files:
              with open(path, 'r', encoding='utf-8') as f:
                  list(yaml.safe_load_all(f))
              print(f'Valid YAML: {path}')
          "

  # ----------------------------------------------------------------------------
  # Job 2: Suíte Automatizada de Testes (pytest — Auth, RBAC, ORM, RFC 9457)
  # ----------------------------------------------------------------------------
  unit-and-contract-tests:
    name: Automated Test Suite (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "src/api/requirements.txt"

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/api/requirements.txt

      - name: Run pytest test suite
        run: pytest -v --tb=short

  # ----------------------------------------------------------------------------
  # Job 3: Validação do Build Docker (sem Push)
  # ----------------------------------------------------------------------------
  docker-build-validation:
    name: Docker Image Build Check
    runs-on: ubuntu-latest
    needs:
      - quality-and-lint
      - unit-and-contract-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Dockerfile build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: character-build-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

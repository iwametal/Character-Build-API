name: CD Staging — Deploy to AWS (ECR + EKS)

# ==============================================================================
# Pré-requisitos para Ativação Futura (GitHub Settings -> Environments -> staging):
#   Secrets:
#     - AWS_ROLE_ARN_STAGING : ARN da IAM Role AWS configurada com OIDC do GitHub
#     - JWT_SECRET_STAGING   : Chave secreta JWT para o ambiente de homologação
#   Variables:
#     - AWS_REGION           : Região AWS (padrão: sa-east-1)
#     - ECR_REPOSITORY       : Nome do repositório Amazon ECR (padrão: character-build-api)
#     - EKS_CLUSTER_STAGING  : Nome do cluster Amazon EKS de staging
#     - K8S_NAMESPACE        : Namespace Kubernetes (padrão: character-build-staging)
# ==============================================================================

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: cd-staging
  cancel-in-progress: false

permissions:
  id-token: write   # Necessário para autenticação OIDC segura na AWS (sem chaves estáticas)
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'sa-east-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'character-build-api' }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_STAGING || 'character-build-eks-staging' }}
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'character-build-staging' }}

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Gate de Qualidade antes do Deploy
  # ----------------------------------------------------------------------------
  test-gate:
    name: Pre-Deploy Test Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "src/api/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/api/requirements.txt

      - name: Run pytest gate
        run: pytest -q

  # ----------------------------------------------------------------------------
  # Job 2: Build, Push para Amazon ECR e Deploy no Amazon EKS (Staging)
  # ----------------------------------------------------------------------------
  deploy-staging:
    name: Build & Deploy to AWS EKS (Staging)
    runs-on: ubuntu-latest
    needs: test-gate
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify AWS OIDC configuration
        id: check-aws
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN_STAGING }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::warning::AWS_ROLE_ARN_STAGING secret is not configured yet. Skipping AWS deploy steps."
            echo "aws_configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "aws_configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.check-aws.outputs.aws_configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.check-aws.outputs.aws_configured == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: steps.check-aws.outputs.aws_configured == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        if: steps.check-aws.outputs.aws_configured == 'true'
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:staging-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image to Amazon ECR
        if: steps.check-aws.outputs.aws_configured == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:staging-${{ steps.meta.outputs.short_sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:staging-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update kubeconfig for Amazon EKS (Staging)
        if: steps.check-aws.outputs.aws_configured == 'true'
        run: |
          aws eks update-kubeconfig \
            --name "${{ env.EKS_CLUSTER_NAME }}" \
            --region "${{ env.AWS_REGION }}"

      - name: Deploy manifests and update image on Amazon EKS
        if: steps.check-aws.outputs.aws_configured == 'true'
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET_STAGING }}
        run: |
          kubectl create namespace "${{ env.K8S_NAMESPACE }}" --dry-run=client -o yaml | kubectl apply -f -

          # Injeção segura do JWT_SECRET no namespace de staging
          if [ -n "$JWT_SECRET" ]; then
            kubectl create secret generic character-build-secrets \
              --namespace "${{ env.K8S_NAMESPACE }}" \
              --from-literal=JWT_SECRET="$JWT_SECRET" \
              --dry-run=client -o yaml | kubectl apply -f -
          fi

          kubectl apply -n "${{ env.K8S_NAMESPACE }}" -f k8s/configmap.yaml
          kubectl apply -n "${{ env.K8S_NAMESPACE }}" -f k8s/pvc.yaml
          kubectl apply -n "${{ env.K8S_NAMESPACE }}" -f k8s/deployment.yaml
          kubectl apply -n "${{ env.K8S_NAMESPACE }}" -f k8s/service.yaml

          kubectl set image deployment/character-build-deployment \
            api="${{ steps.meta.outputs.image_uri }}" \
            --namespace "${{ env.K8S_NAMESPACE }}"

          kubectl rollout status deployment/character-build-deployment \
            --namespace "${{ env.K8S_NAMESPACE }}" \
            --timeout=180s

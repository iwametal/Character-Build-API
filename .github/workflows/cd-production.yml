name: CD Production — Release & Deploy to AWS (ECR + EKS 5 Replicas)

# ==============================================================================
# Pré-requisitos para Ativação Futura (GitHub Settings -> Environments -> production):
#   Recomenda-se habilitar "Required reviewers" no ambiente `production`.
#
#   Secrets:
#     - AWS_ROLE_ARN_PROD : ARN da IAM Role AWS configurada com OIDC do GitHub (Produção)
#     - JWT_SECRET_PROD   : Chave secreta JWT forte para produção (ou AWS Secrets Manager)
#   Variables:
#     - AWS_REGION        : Região AWS (padrão: sa-east-1)
#     - ECR_REPOSITORY    : Nome do repositório Amazon ECR (padrão: character-build-api)
#     - EKS_CLUSTER_PROD  : Nome do cluster Amazon EKS de produção
#     - K8S_NAMESPACE     : Namespace Kubernetes (padrão: character-build)
# ==============================================================================

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  id-token: write       # Necessário para autenticação OIDC segura na AWS
  contents: read
  security-events: write # Permite envio futuro de relatórios SARIF do Trivy

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'sa-east-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'character-build-api' }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_PROD || 'character-build-eks-prod' }}
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'character-build' }}

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Gate de Testes e Scan de Segurança da Imagem (Trivy)
  # ----------------------------------------------------------------------------
  test-and-security-gate:
    name: Production Test & Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "src/api/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/api/requirements.txt

      - name: Run full pytest suite
        run: pytest -q

      - name: Build candidate image for vulnerability scan
        run: docker build -t character-build-api:scan-${{ github.sha }} .

      - name: Run Trivy container vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: character-build-api:scan-${{ github.sha }}
          format: "table"
          exit-code: "0" # Alterar para "1" quando desejar bloquear deploys com CVEs CRITICAL
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

  # ----------------------------------------------------------------------------
  # Job 2: Build Imutável, Push ECR, Deploy EKS (5 Réplicas) e Rollback Automático
  # ----------------------------------------------------------------------------
  deploy-production:
    name: Deploy to AWS EKS (Production — 5 Replicas)
    runs-on: ubuntu-latest
    needs: test-and-security-gate
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify AWS OIDC configuration
        id: check-aws
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN_PROD }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::warning::AWS_ROLE_ARN_PROD secret is not configured yet. Skipping AWS production deploy steps."
            echo "aws_configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "aws_configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.check-aws.outputs.aws_configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.check-aws.outputs.aws_configured == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: steps.check-aws.outputs.aws_configured == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Resolve immutable version tag
        if: steps.check-aws.outputs.aws_configured == 'true'
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION_TAG="prod-${SHORT_SHA}"
          fi
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${VERSION_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push immutable Docker image to Amazon ECR
        if: steps.check-aws.outputs.aws_configured == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.version_tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update kubeconfig for Amazon EKS (Production)
        if: steps.check-aws.outputs.aws_configured == 'true'
        run: |
          aws eks update-kubeconfig \
            --name "${{ env.EKS_CLUSTER_NAME }}" \
            --region "${{ env.AWS_REGION }}"

      - name: RollingUpdate deploy on Amazon EKS (5 replicas)
        if: steps.check-aws.outputs.aws_configured == 'true'
        id: eks-deploy
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET_PROD }}
        run: |
          kubectl apply -f k8s/namespace.yaml

          # Injeção segura do JWT_SECRET de produção no cluster EKS
          if [ -n "$JWT_SECRET" ]; then
            kubectl create secret generic character-build-secrets \
              --namespace "${{ env.K8S_NAMESPACE }}" \
              --from-literal=JWT_SECRET="$JWT_SECRET" \
              --dry-run=client -o yaml | kubectl apply -f -
          fi

          kubectl apply -n "${{ env.K8S_NAMESPACE }}" -f k8s/configmap.yaml
          kubectl apply -n "${{ env.K8S_NAMESPACE }}" -f k8s/pvc.yaml
          kubectl apply -n "${{ env.K8S_NAMESPACE }}" -f k8s/deployment.yaml
          kubectl apply -n "${{ env.K8S_NAMESPACE }}" -f k8s/service.yaml

          kubectl set image deployment/character-build-deployment \
            api="${{ steps.meta.outputs.image_uri }}" \
            --namespace "${{ env.K8S_NAMESPACE }}"

          kubectl rollout status deployment/character-build-deployment \
            --namespace "${{ env.K8S_NAMESPACE }}" \
            --timeout=240s

      - name: Automatic Rollback on Deployment Failure
        if: failure() && steps.check-aws.outputs.aws_configured == 'true' && steps.eks-deploy.outcome == 'failure'
        run: |
          echo "::error::Production rollout failed. Triggering automatic Kubernetes rollback..."
          kubectl rollout undo deployment/character-build-deployment \
            --namespace "${{ env.K8S_NAMESPACE }}"
          kubectl rollout status deployment/character-build-deployment \
            --namespace "${{ env.K8S_NAMESPACE }}" \
            --timeout=180s
